<svg
  xmlns="http://www.w3.org/2000/svg"
  width="700"
  height="420"
  viewBox="0 0 700 420"
>

  <!-- Background -->
  <rect
    width="700"
    height="420"
    rx="24"
    fill="#050509"
  />

  <!-- Anime girl -->
  <image
    href="../images/anime.jpeg"
    x="35"
    y="20"
    width="350"
    height="380"
    preserveAspectRatio="xMidYMid meet"
  />

  <!-- Divider -->
  <line
    x1="400"
    y1="80"
    x2="400"
    y2="340"
    stroke="#252530"
    stroke-width="1"
  />

  <!-- Social links -->
  <g
    font-family="Courier New, monospace"
    text-decoration="none"
  >

    <!-- Discord -->
    <text
      x="440"
      y="125"
      font-size="15"
      font-weight="bold"
      fill="#8b5cf6"
    >
      DISCORD
    </text>

    <text
      x="440"
      y="150"
      font-size="13"
      fill="#77778a"
    >
      null0x001
    </text>


    <!-- Mail -->
    <text
      x="440"
      y="195"
      font-size="15"
      font-weight="bold"
      fill="#8b5cf6"
    >
      MAIL
    </text>

    <text
      x="440"
      y="220"
      font-size="13"
      fill="#77778a"
    >
      contact
    </text>


    <!-- GitHub -->
    <text
      x="440"
      y="265"
      font-size="15"
      font-weight="bold"
      fill="#8b5cf6"
    >
      GITHUB
    </text>

    <text
      x="440"
      y="290"
      font-size="13"
      fill="#77778a"
    >
      @null0x001
    </text>


    <!-- X -->
    <text
      x="440"
      y="335"
      font-size="15"
      font-weight="bold"
      fill="#8b5cf6"
    >
      X
    </text>

    <text
      x="440"
      y="360"
      font-size="13"
      fill="#77778a"
    >
      @null0x001
    </text>

  </g>

</svg>
