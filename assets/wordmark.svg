<?xml version="1.0" encoding="UTF-8"?>

<svg
  xmlns="http://www.w3.org/2000/svg"
  width="882"
  height="236"
  viewBox="0 0 882 236"
  role="img"
  aria-label="NULL0X001 wordmark"
>

  <defs>

    <!-- Background -->
    <linearGradient
      id="wm-bg"
      x1="0"
      y1="0"
      x2="0"
      y2="1"
    >
      <stop offset="0" stop-color="#0d0b14"/>
      <stop offset="1" stop-color="#050509"/>
    </linearGradient>

    <!-- Violet glow -->
    <filter
      id="violet-glow"
      x="-50%"
      y="-50%"
      width="200%"
      height="200%"
    >
      <feGaussianBlur
        stdDeviation="5"
        result="blur"
      />

      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Stronger glow -->
    <filter
      id="strong-glow"
      x="-100%"
      y="-100%"
      width="300%"
      height="300%"
    >
      <feGaussianBlur
        stdDeviation="2"
        result="blur"
      />

      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Wordmark reveal -->
    <clipPath id="wordmark-wipe">
      <rect
        x="0"
        y="25"
        width="882"
        height="125"
      />
    </clipPath>

  </defs>


  <!-- BACKGROUND -->

  <rect
    x="0"
    y="0"
    width="882"
    height="236"
    rx="18"
    fill="url(#wm-bg)"
  />


  <!-- GRID -->

  <g opacity="0.16">

    <path
      d="
        M0 45 H882
        M0 90 H882
        M0 135 H882
        M0 180 H882
      "
      stroke="#A970FF"
      stroke-width="1"
    />

  </g>


  <!-- TERMINAL PROMPT -->

  <text
    x="28"
    y="32"
    font-family="'Courier New', monospace"
    font-size="11"
    font-weight="bold"
    fill="#C084FC"
  >
    root@null0x001:~$
  </text>


  <!-- WORDMARK -->

  <g clip-path="url(#wordmark-wipe)">

    <!-- Purple ghost layer -->

    <text
      x="32"
      y="129"
      font-family="'Courier New', monospace"
      font-size="74"
      font-weight="900"
      letter-spacing="5"
      fill="none"
      stroke="#A970FF"
      stroke-width="1"
      opacity="0.35"
    >

      NULL0X001

      <!-- continuous horizontal movement -->
      <animateTransform
        attributeName="transform"
        type="translate"
        values="
          0 0;
          2 0;
          -1 0;
          1 0;
          0 0
        "
        dur="2.8s"
        repeatCount="indefinite"
      />

    </text>


    <!-- Main text -->

    <text
      x="28"
      y="125"
      font-family="'Courier New', monospace"
      font-size="74"
      font-weight="900"
      letter-spacing="5"
      fill="#FFFFFF"
    >

      NULL0X001

      <!-- subtle glitch -->
      <animate
        attributeName="opacity"
        values="
          1;
          1;
          1;
          0.92;
          1;
          1;
          0.96;
          1
        "
        dur="3.7s"
        repeatCount="indefinite"
      />

    </text>


    <!-- Violet glitch slice -->

    <text
      x="28"
      y="125"
      font-family="'Courier New', monospace"
      font-size="74"
      font-weight="900"
      letter-spacing="5"
      fill="#A970FF"
      opacity="0"
    >

      NULL0X001

      <animate
        attributeName="opacity"
        values="
          0;
          0;
          0.7;
          0;
          0;
          0.45;
          0
        "
        keyTimes="
          0;
          0.42;
          0.44;
          0.46;
          0.78;
          0.80;
          0.82
        "
        dur="4s"
        repeatCount="indefinite"
      />

      <animateTransform
        attributeName="transform"
        type="translate"
        values="
          0 0;
          -5 0;
          4 0;
          0 0
        "
        dur="4s"
        repeatCount="indefinite"
      />

    </text>


    <!-- Underline -->

    <rect
      x="30"
      y="145"
      width="550"
      height="2"
      fill="#A970FF"
      opacity="0.7"
    >

      <!-- moving brightness -->

      <animate
        attributeName="opacity"
        values="
          0.35;
          0.75;
          0.35
        "
        dur="2.2s"
        repeatCount="indefinite"
      />

    </rect>

  </g>


  <!-- CONTINUOUS SCAN LINE -->

  <rect
    x="18"
    y="42"
    width="2"
    height="125"
    fill="#C084FC"
    filter="url(#violet-glow)"
  >

    <animate
      attributeName="x"
      values="
        18;
        864;
        864;
        18
      "
      keyTimes="
        0;
        0.42;
        0.52;
        1
      "
      dur="5s"
      repeatCount="indefinite"
    />

    <animate
      attributeName="opacity"
      values="
        0;
        1;
        0;
        0
      "
      keyTimes="
        0;
        0.12;
        0.48;
        1
      "
      dur="5s"
      repeatCount="indefinite"
    />

  </rect>


  <!-- SCAN PARTICLES -->

  <g fill="#A970FF">

    <circle cx="25" cy="51" r="1">
      <animate
        attributeName="opacity"
        values="0.2;1;0.2"
        dur="1.4s"
        repeatCount="indefinite"
      />
    </circle>

    <circle cx="850" cy="93" r="1">
      <animate
        attributeName="opacity"
        values="1;0.2;1"
        dur="2s"
        repeatCount="indefinite"
      />
    </circle>

    <circle cx="610" cy="176" r="1">
      <animate
        attributeName="opacity"
        values="0.2;1;0.2"
        dur="1.8s"
        repeatCount="indefinite"
      />
    </circle>

  </g>


  <!-- SUBTITLE -->

  <text
    x="30"
    y="175"
    font-family="'Courier New', monospace"
    font-size="12"
    letter-spacing="2"
    fill="#77778A"
  >
    BUILDING FROM FUNDAMENTALS

    <animate
      attributeName="opacity"
      values="
        0.65;
        0.65;
        1;
        0.65
      "
      dur="3s"
      repeatCount="indefinite"
    />

  </text>


  <!-- STATUS -->

  <circle
    cx="30"
    cy="203"
    r="4"
    fill="#A970FF"
    filter="url(#strong-glow)"
  >

    <animate
      attributeName="r"
      values="3;5;3"
      dur="1.6s"
      repeatCount="indefinite"
    />

    <animate
      attributeName="opacity"
      values="0.5;1;0.5"
      dur="1.6s"
      repeatCount="indefinite"
    />

  </circle>


  <text
    x="42"
    y="207"
    font-family="'Courier New', monospace"
    font-size="11"
    fill="#77778A"
  >
    SYSTEM ONLINE
  </text>


  <!-- SIGNATURE -->

  <text
    x="850"
    y="215"
    text-anchor="end"
    font-family="'Courier New', monospace"
    font-size="10"
    fill="#77778A"
    opacity="0.65"
  >
    null0x001
  </text>

</svg>
