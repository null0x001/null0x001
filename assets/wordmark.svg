<?xml version="1.0" encoding="UTF-8"?>

<svg
  xmlns="http://www.w3.org/2000/svg"
  width="882"
  height="236"
  viewBox="0 0 882 236"
  role="img"
  aria-label="NULL0X001 wordmark"
>

  <defs>

    <!-- Background -->
    <linearGradient
      id="wm-bg"
      x1="0"
      y1="0"
      x2="0"
      y2="1"
    >
      <stop offset="0" stop-color="#0d0b14"/>
      <stop offset="1" stop-color="#050509"/>
    </linearGradient>

    <!-- Violet glow -->
    <filter
      id="violet-glow"
      x="-30%"
      y="-30%"
      width="160%"
      height="160%"
    >

      <feGaussianBlur
        stdDeviation="5"
        result="blur"
      />

      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>

    </filter>

    <!-- Text wipe -->
    <clipPath id="wordmark-wipe">

      <rect
        x="18"
        y="35"
        width="0"
        height="150"
      >

        <animate
          attributeName="width"
          from="0"
          to="846"
          begin="0.2s"
          dur="2.2s"
          fill="freeze"
        />

      </rect>

    </clipPath>

  </defs>


  <!-- ═══════════════════════════════════════════════
       BACKGROUND
  ═══════════════════════════════════════════════ -->

  <rect
    x="0"
    y="0"
    width="882"
    height="236"
    rx="18"
    fill="url(#wm-bg)"
  />


  <!-- ═══════════════════════════════════════════════
       SUBTLE GRID
  ═══════════════════════════════════════════════ -->

  <g opacity="0.18">

    <path
      d="M0 45 H882
         M0 90 H882
         M0 135 H882
         M0 180 H882"
      stroke="#A970FF"
      stroke-width="1"
    />

  </g>


  <!-- ═══════════════════════════════════════════════
       TERMINAL PROMPT
  ═══════════════════════════════════════════════ -->

  <text
    x="28"
    y="32"
    font-family="'Courier New', monospace"
    font-size="11"
    font-weight="bold"
    fill="#C084FC"
  >
    root@null0x001:~$
  </text>


  <!-- ═══════════════════════════════════════════════
       WORDMARK
  ═══════════════════════════════════════════════ -->

  <g clip-path="url(#wordmark-wipe)">

    <!-- Main wordmark -->

    <text
      x="28"
      y="125"
      font-family="'Courier New', monospace"
      font-size="74"
      font-weight="900"
      letter-spacing="5"
      fill="#FFFFFF"
    >
      NULL0X001
    </text>


    <!-- Purple offset -->
    <text
      x="32"
      y="129"
      font-family="'Courier New', monospace"
      font-size="74"
      font-weight="900"
      letter-spacing="5"
      fill="none"
      stroke="#A970FF"
      stroke-width="1"
      opacity="0.5"
    >
      NULL0X001
    </text>


    <!-- Underline -->

    <rect
      x="30"
      y="145"
      width="550"
      height="2"
      fill="#A970FF"
      opacity="0.7"
    />

  </g>


  <!-- ═══════════════════════════════════════════════
       SCAN CURSOR
  ═══════════════════════════════════════════════ -->

  <rect
    x="18"
    y="45"
    width="3"
    height="115"
    fill="#C084FC"
    filter="url(#violet-glow)"
  >

    <animate
      attributeName="x"
      from="18"
      to="864"
      begin="0.2s"
      dur="2.2s"
      fill="freeze"
    />

    <animate
      attributeName="opacity"
      values="0;1;1;0"
      keyTimes="0;0.1;0.9;1"
      begin="0.2s"
      dur="2.2s"
      fill="freeze"
    />

  </rect>


  <!-- ═══════════════════════════════════════════════
       SUBTITLE
  ═══════════════════════════════════════════════ -->

  <text
    x="30"
    y="175"
    font-family="'Courier New', monospace"
    font-size="12"
    letter-spacing="2"
    fill="#77778A"
  >
    BUILDING FROM FUNDAMENTALS
  </text>


  <!-- Status -->

  <circle
    cx="30"
    cy="203"
    r="4"
    fill="#A970FF"
  />

  <text
    x="42"
    y="207"
    font-family="'Courier New', monospace"
    font-size="11"
    fill="#77778A"
  >
    SYSTEM ONLINE
  </text>


  <!-- Signature -->

  <text
    x="850"
    y="215"
    text-anchor="end"
    font-family="'Courier New', monospace"
    font-size="10"
    fill="#77778A"
    opacity="0.65"
  >
    null0x001
  </text>

</svg>
